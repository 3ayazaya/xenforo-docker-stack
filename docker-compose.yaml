services:
  web:
    image: nginx:stable-alpine3.20-perl
    container_name: xenforo-web
    restart: always
    volumes:
      - ./xenforo:/var/www/html
      - ./nginx.conf:/etc/nginx/conf.d/default.conf
    ports:
      - "80:80"
      - "443:443"
    depends_on:
      - php
      - db
      - redis

  php:
    image: xenforo-php:8.2.7
    build: 
      context: ./docker-xenforo/php-fpm
      args:
        DOCKER_XENFORO_PHP_EXT_INSTALL: "exif gd gmp mysqli opcache pcntl soap sockets zip"
        DOCKER_XENFORO_PHP_PECL_INSTALL: "apcu igbinary imagick memcached redis xdebug"
    container_name: xenforo-php
    restart: always
    volumes:
      - ./xenforo:/var/www/html
      - ./php.ini-production:/usr/local/etc/php/php.ini

  db:
    image: mariadb:10.5
    container_name: xenforo-db
    restart: always
    env_file:
      - .env
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-xenforo}
      MYSQL_USER: ${MYSQL_USER:-xenforo}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-xenforo}
    volumes:
      - ./mysql_data:/var/lib/mysql
  
  redis:
    image: redis:6.2-alpine
    container_name: xenforo-cache
    restart: always
    env_file:
      - .env
    command: "redis-server --save 20 1 --loglevel warning --requirepass ${REDIS_PASSWORD:-xenforo}"
    volumes:
      - ./redis_data:/data

  adminer:
    image: adminer
    container_name: xenforo-adminer
    restart: always
    ports:
      - "127.0.0.1:8081:8080"

  nginx-exporter:
    image: nginx/nginx-prometheus-exporter:1.4
    container_name: xenforo-nginx-exporter
    restart: always
    command: '--nginx.scrape-uri=http://xenforo-web/basic_status'
    ports:
      - "9113:9113"

  backuper:
    image: 3ayazaya/backuper:latest
    build: 
      context: ./backuper
    container_name: xenforo-backup
    restart: always
    env_file:
      - .env
    environment:
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-xenforo}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-xenforo}
      S3_HOST: ${S3_HOST:-minio.local}
      S3_HOST_BUCKET: ${S3_HOST_BUCKET:-minio.local}
      S3_BUCKET_NAME: ${S3_BUCKET_NAME:-backup}
      MYSQL_HOST: xenforo-db
      MYSQL_USER: ${MYSQL_USER:-xenforo}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-xenforo}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-xenforo}
    depends_on:
      - php
      - db
    volumes:
     - ./backuper/crontab:/etc/crontab
     - ./backuper/backup.sh:/etc/periodic/daily/backup
     - ./backups:/backups
     - ./xenforo:/xenforo:ro
     - /etc/timezone:/etc/timezone:ro
     - /etc/localtime:/etc/localtime:ro
